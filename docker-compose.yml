services:
  chromadb:
    # Chroma 1.x (Rust rewrite). Public tag chromadb/chroma:1.5.9 (released
    # 2026-05-05), manifest digest pinned below so Docker Hub cannot silently
    # re-tag it. Upgraded from 1.2.4 on 2026-10-25 after a rehearsal on a volume
    # copy: 334,240 records identical across all 4 databases, determinism canary
    # green, HNSW recall@10 vs exact 0.993 (1.2.4: 0.994). Keep the client pin
    # (requirements.txt) on the same version. Pre-upgrade cold backup: docker
    # volume chroma-backup-pre159-20261025 (rollback = restore it + old digest
    # sha256:70c20dbcb64edbfad111a87149e7828348510246d1bb67c727f6aea926d3db7a;
    # 1.5.9 may migrate the on-disk schema, so never point 1.2.4 at 1.5.9 data).
    #
    # The model (all-MiniLM-L6-v2) is statically baked into the 487MB chroma
    # binary inside this image — no HuggingFace download at runtime. Empirical
    # determinism verified 2026-05-15: 10 diverse texts × 384 dims = 3840/3840
    # floats bit-equal between two fresh instances of this digest on x86_64.
    # See tests/test_chroma_determinism.py — that test pins the (text, vector)
    # baseline; if you upgrade this image, regenerate the test baseline AND
    # be aware all stored embeddings must be considered cross-version-incompatible.
    #
    # Do NOT downgrade to 0.6.x — different SQLite schema, can't read 1.x data
    # (verified 2026-04-17 during migration: 0 collections visible after downgrade).
    # When upgrading to a newer 1.x point release, test on a volume COPY first.
    image: chromadb/chroma:1.5.9@sha256:1e0b73a187a28757c572acba508c46f48c9e8b0acaf5c20e6d95cdedce1acdf6
    container_name: mcp-chromadb
    # Chroma 1.x persists to /data by default. The previous mount at
    # /chroma/chroma was silently ignored, causing the Apr 2026 data loss
    # incident when the pre-existing container was recreated. Keep this
    # at /data and never change it without testing a container rebuild.
    volumes:
      - chroma-data:/data
    ports:
      # Bind to loopback only (design:auth-origin-trust-v0). Container-to-
      # container access uses the compose network (CHROMA_HOST=chromadb), so
      # this published port is host-side debugging only. Keeping it off 0.0.0.0
      # closes the tailnet/OVH-wg exposure networking found 2026-06-06.
      - "127.0.0.1:${CHROMA_PORT:-8001}:8000"
    healthcheck:
      # This image doesn't ship curl/wget. Use bash's /dev/tcp to check if
      # the HTTP port accepts connections (opens socket, immediately closes).
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8000'"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  mongodb:
    # Pinned version for the same reason as chromadb above.
    image: mongo:7.0
    container_name: mcp-mongodb
    # Single-node replica set so we get multi-document transactions and
    # change streams (needed for Phase 1 op-log atomicity). The replica
    # set name is rs0; client connection strings need `?replicaSet=rs0`
    # to use member discovery, or `?directConnection=true` to bypass it
    # (required for host-side debugging via localhost:27019 since the
    # replica set advertises the docker-network hostname "mongodb").
    #
    # The keyfile is required for internal replication-protocol auth
    # whenever --auth is on, even for single-member sets. The image
    # entrypoint enables auth automatically when MONGO_INITDB_ROOT_USERNAME
    # is set, so we always need the keyfile here. Keyfile must be:
    #   - mode 400 (owner-only read)
    #   - owned by UID 999 (the mongo user inside the container)
    # If you regenerate it: `openssl rand -base64 756 > secrets/mongo-keyfile`
    # then `chmod 400 secrets/mongo-keyfile && sudo chown 999:999 secrets/mongo-keyfile`.
    command:
      - "mongod"
      - "--replSet"
      - "rs0"
      - "--keyFile"
      - "/etc/mongo/keyfile"
      - "--bind_ip_all"
    # WiredTiger keeps a file handle per collection + index. The Docker default
    # (1024) was exhausted on 2026-10-13 and mongod fassert-looped on startup
    # ("Too many open files"). 64000 is MongoDB's documented recommendation.
    ulimits:
      nofile:
        soft: 64000
        hard: 64000
    volumes:
      - mongo-data:/data/db
      - ./secrets/mongo-keyfile:/etc/mongo/keyfile:ro
    ports:
      # Loopback only (design:auth-origin-trust-v0). The MCP server reaches
      # Mongo over the compose network (MONGO_HOST=mongodb); this published
      # port is host-side debugging only (mongosh via localhost:27019). Never
      # expose the database off-host.
      - "127.0.0.1:${MONGO_PORT:-27019}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-mcp_orch}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-changeme}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-mcp_orchestrator}
    healthcheck:
      # --quiet suppresses the connect banner; we hit a uninitialized-replSet
      # member here right after recreation, so use directConnection to avoid
      # the client doing replica-set discovery before rs.initiate() runs.
      test: ["CMD", "mongosh", "--quiet", "--norc", "mongodb://localhost:27017/?directConnection=true", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  mcp-server:
    build: .
    container_name: mcp-rag-arch
    depends_on:
      chromadb:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    env_file: .env
    environment:
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      # Op-log origin identifier (Phase 1, design v0.3.0 §4.5). This tags
      # every op-log entry this server writes. MUST be unique-per-deployment
      # once Phase 2 lands and LAN-local instances appear; today the
      # central singleton uses `central`.
      - ORIGIN_SERVER_ID=${ORIGIN_SERVER_ID:-central}
      # Per-tool latency logging (src/shared_memory/timing.py). Set to 1 for
      # diagnosis runs; unset/empty for normal operation (zero overhead).
      - JUNTO_TIMING_LOG=${JUNTO_TIMING_LOG:-}
      # Keyless sessions arriving via the Cloudflare tunnel soft-fall to agent
      # tier (design:auth-origin-trust-v0 flag, learning_0b5c97149eb58ec3).
      # FALSE here because Cloudflare Access already does identity authn at
      # the edge (401 before the request reaches this server) AND claude.ai
      # connectors cannot send a Bearer key — true would hard-block every
      # cloud connector (tom-assistant/advisor/research/DeeAnn). Flip to true
      # ONLY if the CF Access app on the public tunnel hostname is ever removed.
      - JUNTO_TUNNEL_REQUIRES_KEY=${JUNTO_TUNNEL_REQUIRES_KEY:-false}
      # Write-time contradiction gate, classifier stage (claim_gate.py,
      # interface:claim-extraction-v0). Advisory + fail-quiet: with the
      # endpoint down, memory_record_learning degrades to threshold-only
      # pointers. Default OFF; flip in .env when the host Ollama endpoint
      # is reachable from the container (extra_hosts below provides
      # host.docker.internal on Linux).
      - JUNTO_CLAIM_GATE_ENABLED=${JUNTO_CLAIM_GATE_ENABLED:-false}
      - JUNTO_CLAIM_GATE_URL=${JUNTO_CLAIM_GATE_URL:-http://host.docker.internal:11434/v1}
      - JUNTO_CLAIM_GATE_MODEL=${JUNTO_CLAIM_GATE_MODEL:-phi4:14b}
      - JUNTO_CLAIM_GATE_EXTRACT_MODEL=${JUNTO_CLAIM_GATE_EXTRACT_MODEL:-}
      - JUNTO_CLAIM_GATE_EXTRACT_REASONING=${JUNTO_CLAIM_GATE_EXTRACT_REASONING:-}
      - JUNTO_LOG_QUERY_TEXT=${JUNTO_LOG_QUERY_TEXT:-true}
      # Pending-agent GC (identity_gc.py, design:identity-lifecycle-v0
      # Mechanism B). Reaps PENDING-tier roster ghosts idle past the grace
      # window (never named/admin; blocked by live sessions and open inbound
      # obligations). Default OFF — enable only after the roster's legitimate
      # long-livers are promoted to named (done on sage 2026-07-12).
      - JUNTO_PENDING_REAP_ENABLED=${JUNTO_PENDING_REAP_ENABLED:-false}
      - JUNTO_PENDING_REAP_GRACE_HOURS=${JUNTO_PENDING_REAP_GRACE_HOURS:-48}
    extra_hosts:
      # Lets the container reach host services (Ollama :11434) on Linux,
      # where host.docker.internal is not automatic.
      - "host.docker.internal:host-gateway"
    ports:
      # Bind to loopback + one LAN/tailnet IP only — NOT 0.0.0.0 (design:auth-
      # origin-trust-v0). A local tunnel client (cloudflared) connects via
      # 127.0.0.1, so a public tunnel still works; agents on that network reach
      # the IP below. Nothing listens on other interfaces (VPNs, other tailnets).
      # JUNTO_MCP_LAN_IP is REQUIRED (no default): set it in .env to this host's
      # LAN or Tailscale IP. Compose refuses to start without it rather than
      # trying to bind someone else's address. For a loopback-only (tunnel-only)
      # deployment, drop the second mapping.
      - "127.0.0.1:8080:8080"
      - "${JUNTO_MCP_LAN_IP:?set JUNTO_MCP_LAN_IP in .env to this host's LAN or Tailscale IP}:8080:8080"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  # These volumes are declared external so compose never creates or destroys
  # them — populated in 2026-04-14 during data-loss recovery. A fresh deploy
  # elsewhere should remove the `external` + `name` fields so compose creates
  # them automatically on first `up -d`.
  chroma-data:
    external: true
    name: chroma-persistent
  mongo-data:
    external: true
    name: mcp-mongo-persistent
